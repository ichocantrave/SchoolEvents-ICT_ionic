<app-cabecera titulo="Mis favoritos"></app-cabecera>
<ion-content class="pagina-blanca">
    <h2>Mis favoritos</h2>
    @if (eventos.length > 0) {
        <div class="lista">
            @for (evento of eventos; track evento.id) {
                <div>
                    <app-tarjeta-evento [evento]="evento"></app-tarjeta-evento>
                    <button class="cancelar"
                            (click)="quitarFavorito(evento.id)">
                        Quitar de favoritos
                    </button>
                </div>
            }
        </div>
    } @else {
        <div class="vacio">
            <h3>Aún no tienes eventos favoritos</h3>
            <p>Entra en un evento y pulsa <span style="color: red;">&#10084;</span> para añadirlo aquí.</p>
            <a routerLink="/app/eventos">
                Ver eventos para agregar a favoritos
            </a>
        </div>
    }
</ion-content>
