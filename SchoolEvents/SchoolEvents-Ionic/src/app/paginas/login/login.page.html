<ion-content [fullscreen]="true" class="school-login">
    <main class="login-layout">
        <!--Logo -->
        <header class="identidad" aria-label="SchoolEvents">
            <img src="assets/schoolevents/logo.png" alt="" class="identidad__icono" />
        </header>
        <section class="tarjeta" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Inicio de Sesión</h1>
            <!-- Formu visual de demo -->
            <form class="formulario" (submit)="iniciarSesion($event)">
                <label class="campo">
                    <span class="campo__etiqueta">Correo escolar</span>
                    <input
                            type="email"
                            name="correo"
                            placeholder="ejemplo@colegio.es"
                            autocomplete="email"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                    />
                </label>
                <label class="campo campo--clave">
                    <span class="campo__etiqueta">Contraseña</span>
                    <input
                            type="password"
                            name="contrasena"
                            placeholder="Escriba una contraseña"
                            autocomplete="current-password"
                            required
                    />
                </label>
                <button class="enlace-olvido" type="button" (click)="recuperarContrasena()">
                    ¿Has olvidado tu contraseña?
                </button>
                <button class="boton-entrar" type="submit">
                    <span>Iniciar sesión</span>
                    <svg viewBox="0 0 32 20" width="32" height="20" aria-hidden="true" focusable="false"> <!--prepare draw de 32 pix ancho y 20 alto-->
                        <!--Termina el dibujitoo de la flecita (lo he  buscado en chatgpt porque se me da mal calcular)-->
                        <path d="M1 10h28M21 2l8 8-8 8" stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round" fill="none" />
                    </svg>
                </button>
            </form>
            <div class="separador" aria-hidden="true"><span>o</span></div>
            <button type="button" class="boton-escolar" (click)="cuentaEscolar()">
                Acceder con cuenta escolar
            </button>
            @if (mensaje) {
                <p class="aviso" role="status">{{ mensaje }}</p>
            }
        </section>
    </main>
</ion-content>
