<ion-content class="fondo">
    <main class="panel">
        <img src="assets/schoolevents/logo.png" alt="SchoolEvents">
        <h1>{{enviado?'¡Listo!':'¿Has olvidado tu contraseña?'}}</h1>
@if(enviado){
    <p>Este es un ejemplo visual. Para enviar realmente un enlace de recuperación hay que conectar un servidor de autenticación.</p>
    <a routerLink="/login">Volver al inicio</a>
}
@else{
    <p>Introduce tu correo escolar para recuperar el acceso.</p>
    <form (submit)="enviar($event)">
        <label>Correo escolar
            <input type="email" name="correo" [(ngModel)]="correo" required autocomplete="email" placeholder="ejemplo@colegio.es" />
        </label>
        <button type="submit">Enviar enlace</button>
    </form>
    <a routerLink="/login">Volver</a>
}
</main>
</ion-content>
